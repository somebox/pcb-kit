name: Release

# On a pull request: the four version strings agree and CHANGELOG.md has the current version's section.
# On a pushed v* tag (made by `python3 scripts/release.py tag`): the same check against the tag, then a GitHub
# release titled and described from that CHANGELOG.md section. Nothing is built: projects use a checkout of the kit.

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The tag name reaches the shell only through the environment, quoted: a v* tag can hold ; $ ( ) and the like,
      # and release.py refuses anything that is not vX.Y.Z before it is used.
      - env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python3 scripts/release.py check ${TAG:+"$TAG"}

  publish:
    name: Publish release
    needs: versions
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v5
      - name: Release notes and title
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release.py notes "$TAG" > notes.md
          python3 scripts/release.py title "$TAG" > title.txt
      # github-script signs in as this workflow by itself. This file is inside the plugin folder, which the plugin
      # directory scans, and the scan holds a step that passes the workflow's credential to a command for review.
      - name: Publish GitHub release
        uses: actions/github-script@v9
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });  // the tag must already be pushed
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: fs.readFileSync('title.txt', 'utf8').trim(),
              body: fs.readFileSync('notes.md', 'utf8'),
            });
