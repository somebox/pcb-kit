[project]
name = "pcbkit"
version = "0.2.0"
description = "Shared KiCad workflow tooling for somebox hardware projects: checks, release files, schematic building, agent skills"
license = { text = "MIT" }
authors = [{ name = "Jeremy Seitz", email = "7750+somebox@users.noreply.github.com" }]
# 3.9 is KiCad 10's bundled Python on macOS; every module that touches pcbnew runs there.
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pcbkit = "pcbkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcbkit"]
