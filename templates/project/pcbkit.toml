# pcb-kit's settings for this project: which boards it has, how they are released (pcbkit release) and where the
# production record lives (pcbkit production). Every key is optional; the commented values are the defaults, and
# under [[release.profile]] and [[production.part]] an example (docs/CONVENTIONS.md in pcb-kit). Paths may use
# {key} (the PCB's file stem), {folder} (its board folder) and {sub} ("" for a folder's only PCB, "/<stem>" for
# any other).

[boards]
folders = ["boards/*"]                 # globs of board folders, relative to this file
# subfolders = []                      # subfolders of a board folder with more PCBs, e.g. ["panel"]
# exclude = []                         # PCB paths or board folders to leave out (globs)

[release]
# A changed board's next version: minor when its netlist or BOM changed (a part, a value, an LCSC or MPN field, a
# connection), patch when only its layout did; --dry-run says which and what changed. --major for a new header
# pinout, outline, mounting holes or GPIO map; --minor or --patch to override. A first release takes --version when
# the title block names a version (boards of it may have been built); a draft's (0.1-draft) is taken as it is.
# The silkscreen says ${REVISION} and ${ISSUE_DATE}, which KiCad fills from the title block release stamps.
# enabled = true                       # false: no versions or stamping; pcbkit release only checks
# dir = "releases/{key}"               # <dir>/<label>/ per version: fab files, PDFs and the KiCad project (kicad/),
#                                      # releases.toml beside them (committed)
# label = "short"                      # v1.0, then v1.0.1 after a fix; "full": always v1.0.0
# date_format = "%Y-%m-%d"             # the title block's date, so ${ISSUE_DATE}'s; e.g. "%m.%Y" for 11.2026
# fab = ["jlcpcb", "pcbway"]           # whose assembly files to write; the Gerber zip serves both
# placed = "not-excluded"              # what the assembler places; or a field, e.g. "field:Assembly=jlc"
# previews = true                      # pcbkit previews of each released version
# previews_dir = "docs/previews/{key}"
# previews_render = true               # false when previews_after renders them
# previews_after = ""                  # a project command run after the previews, e.g. "scripts/render.sh {key}"

# [[release.profile]]                  # per PCB, the first whose match (a glob on its path) fits
# match = "boards/*-panel/*"
# release = true
# checks = ["erc", "drc", "parity", "standard"]   # the default. A PCB that fails ERC, DRC or parity is a mockup:
#                                      # reported, not released. "standard": pcbkit standard's errors stop a release
# assembly = false                     # Gerbers only
# extra_layers = ["Cmts.User"]         # added to the Gerbers, e.g. V-score lines drawn there
# keep_silk_in_mask = true             # silkscreen inside mask openings stays in the Gerbers (a face panel's legends)

[production]
# enabled = true
# page = "PRODUCTION.md"               # its overview goes between the pcbkit:production markers
# dir = "production"                   # orders/<name>/order.toml, stock.toml

# [[production.part]]                  # what a board needs besides its hand-soldered parts, from a footprint field
# pcb = "boards/*"
# field = "Panel"
# match = '\((B\d+K)\)'                # the first rule that matches wins, in its group; {1} is the first group
# part = ["9 mm pot {1}", "knob"]      # "" for nothing
# buy = "Thonk"                        # where it comes from, for the shopping list in each ORDER.md
# group = ""                           # e.g. "cable": matched apart, so a connector can give a part and a cable
# replace = false                      # true: the footprint's own hand part is dropped (counted elsewhere)

# [standard]                           # pcbkit standard: "What a released board carries" (docs/CONVENTIONS.md)
# label_distance = 2.0                 # mm from a part or test pad to a silkscreen text that counts as its label
# bom = ""                             # the BOM.md Extended parts are looked up in; default: the nearest one upwards
# [standard.rails]                     # the nets that need a test pad, per PCB; default: the nets its schematic's
# main = ["+3V3", "+5V", "GND"]        # power symbols name
# [[standard.waive]]                   # a finding left for a later revision; shown with its note in every report
# board = "main"                       # a PCB's key, or a glob on its path or folder; without it, every board
# check = "test-pads"                  # version, date, title-block, labels, test-pads, test-pad-labels, mounting,
#                                      # lcsc, extended
# items = ["+5V"]                      # the references, nets or sheets it covers; without it, the whole check
# note = "on J3 pin 2; a pad in v1.1"  # required: what is left out and why

# [overview]                           # docs/overview.html, the project on one page (pcbkit overview)
# dir = "docs/overview"                # its rounds, r1.toml, r2.toml, ..., and img/, their pictures
# page = "docs/overview.html"
# frames = 16                          # pictures a side in a board's turntable
# size = "800x600"                     # of each
# layer_width = 1400                   # pixels across a layer picture
# base = ""                            # a URL its sources link to, e.g. the repo's .../blob/main
